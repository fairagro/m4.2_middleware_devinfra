# Canonical reusable registry retry for an existing Docker/Helm release (issue #34).
# Does NOT create a new semver, git tag, or GitHub Release.
# Call from the product repo (thin workflow_dispatch):
#   uses: fairagro/m4.2_middleware_devinfra/.github/workflows/reusable-registry-retry.yml@<ref>
#
# Docker: checkout git_tag → Bake rebuild → push selected registries.
# Helm final: download Release .tgz → helm push to selected OCI registries.
# Helm pre-release is out of scope.
name: Reusable Registry Retry

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      git_tag:
        description: "Existing release git tag (e.g. 20260916120000-docker-v1.2.3 or …-chart-v1.2.3)"
        required: true
        type: string
      release_kind:
        description: "docker or helm"
        required: true
        type: string
      retry_dockerhub:
        description: "Retry push to DockerHub"
        required: false
        type: boolean
        default: false
      retry_ghcr:
        description: "Retry push to GHCR"
        required: false
        type: boolean
        default: false
      components:
        description: "JSON array of Docker components (required when release_kind=docker)"
        required: false
        type: string
        default: "[]"
      image_base_name:
        description: "Image name prefix matching build tags"
        required: false
        type: string
        default: "fairagro-advanced-middleware"
      dockerhub_namespace:
        description: "Docker Hub namespace / organization"
        required: false
        type: string
        default: "zalf"
      ghcr_namespace:
        description: "GHCR namespace (owner); empty defaults to github.repository_owner"
        required: false
        type: string
        default: ""
      chart_name:
        description: "Helm chart name (OCI repo / .tgz basename prefix); required when release_kind=helm"
        required: false
        type: string
        default: ""
    secrets:
      DOCKERHUB_USER:
        required: false
      DOCKERHUB_TOKEN:
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Validate inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.parse.outputs.version }}
      kind: ${{ steps.parse.outputs.kind }}
    steps:
      - name: Require at least one registry flag
        run: |
          if [[ "${{ inputs.retry_dockerhub }}" != "true" && "${{ inputs.retry_ghcr }}" != "true" ]]; then
            echo "::error::Set retry_dockerhub and/or retry_ghcr to true."
            exit 1
          fi

      - name: Fail closed when DockerHub retry lacks secrets
        if: ${{ inputs.retry_dockerhub }}
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "${DOCKERHUB_USER}" || -z "${DOCKERHUB_TOKEN}" ]]; then
            echo "::error::retry_dockerhub=true but DOCKERHUB_USER and/or DOCKERHUB_TOKEN were not provided."
            exit 1
          fi

      - name: Parse git_tag and release_kind
        id: parse
        run: |
          KIND="${{ inputs.release_kind }}"
          TAG="${{ inputs.git_tag }}"
          case "$KIND" in
            docker|helm) ;;
            *)
              echo "::error::release_kind must be 'docker' or 'helm' (got '${KIND}')."
              exit 1
              ;;
          esac
          if [[ "$KIND" == "docker" ]]; then
            if [[ ! "$TAG" =~ ^[0-9]+-docker-v(.+)$ ]]; then
              echo "::error::git_tag '${TAG}' does not match Docker release pattern '{timestamp}-docker-v{version}'."
              exit 1
            fi
            VERSION="${BASH_REMATCH[1]}"
            if [[ "${{ inputs.components }}" == "[]" || -z "${{ inputs.components }}" ]]; then
              echo "::error::components JSON array is required when release_kind=docker."
              exit 1
            fi
          else
            if [[ ! "$TAG" =~ ^[0-9]+-chart-v(.+)$ ]]; then
              echo "::error::git_tag '${TAG}' does not match Helm final release pattern '{timestamp}-chart-v{version}'."
              exit 1
            fi
            VERSION="${BASH_REMATCH[1]}"
            if [[ -z "${{ inputs.chart_name }}" ]]; then
              echo "::error::chart_name is required when release_kind=helm."
              exit 1
            fi
          fi
          echo "kind=${KIND}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Parsed kind=${KIND} version=${VERSION} from tag=${TAG}"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Assert git tag exists
        run: |
          TAG="${{ inputs.git_tag }}"
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::git tag '${TAG}' not found in ${{ github.repository }}."
            exit 1
          fi

      - name: Assert GitHub Release exists for tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.git_tag }}"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::No GitHub Release for tag '${TAG}' (Helm pre-release retry is out of scope)."
            exit 1
          fi

  docker-build:
    name: Docker rebuild
    needs: validate
    if: ${{ needs.validate.outputs.kind == 'docker' }}
    strategy:
      matrix:
        component: ${{ fromJson(inputs.components) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.git_tag }}

      - name: Load version pins from versions.env
        id: versions
        run: |
          # shellcheck source=scripts/load-versions-env.sh
          source scripts/load-versions-env.sh
          {
            echo "python=${PYTHON_VERSION}"
            echo "alpine=${ALPINE_VERSION}"
            echo "alpine_minor=${ALPINE_MINOR}"
            echo "pip=${PIP_VERSION}"
            echo "uv=${UV_VERSION}"
            echo "pyinstaller=${PYINSTALLER_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (Bake)
        uses: docker/bake-action@v7
        with:
          files: docker-bake.hcl
          targets: ${{ matrix.component }}
          load: true
          set: |
            *.platform=linux/amd64
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
            ${{ matrix.component }}.tags=local/${{ inputs.image_base_name }}-${{ matrix.component }}:${{ needs.validate.outputs.version }}
            *.args.APP_VERSION=${{ needs.validate.outputs.version }}
            *.args.PYTHON_VERSION=${{ steps.versions.outputs.python }}
            *.args.ALPINE_VERSION=${{ steps.versions.outputs.alpine }}
            *.args.ALPINE_MINOR=${{ steps.versions.outputs.alpine_minor }}
            *.args.PIP_VERSION=${{ steps.versions.outputs.pip }}
            *.args.UV_VERSION=${{ steps.versions.outputs.uv }}
            *.args.PYINSTALLER_VERSION=${{ steps.versions.outputs.pyinstaller }}

      - name: Save Docker image as artifact
        run: |
          IMAGE_TAG="local/${{ inputs.image_base_name }}-${{ matrix.component }}:${{ needs.validate.outputs.version }}"
          docker save "$IMAGE_TAG" | gzip > "docker-image-${{ matrix.component }}.tar.gz"

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v7
        with:
          name: retry-docker-image-${{ matrix.component }}-${{ needs.validate.outputs.version }}
          path: docker-image-${{ matrix.component }}.tar.gz
          retention-days: 1

  docker-push-dockerhub:
    name: Retry push DockerHub
    needs: [validate, docker-build]
    if: ${{ needs.validate.outputs.kind == 'docker' && inputs.retry_dockerhub }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        component: ${{ fromJson(inputs.components) }}
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v8
        with:
          name: retry-docker-image-${{ matrix.component }}-${{ needs.validate.outputs.version }}

      - name: Load Docker image
        run: docker load < "docker-image-${{ matrix.component }}.tar.gz"

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and Push to DockerHub
        id: push
        run: |
          LOCAL_TAG="local/${{ inputs.image_base_name }}-${{ matrix.component }}:${{ needs.validate.outputs.version }}"
          DH_TAG="${{ inputs.dockerhub_namespace }}/${{ inputs.image_base_name }}-${{ matrix.component }}:${{ needs.validate.outputs.version }}"
          docker tag "$LOCAL_TAG" "$DH_TAG"
          docker push "$DH_TAG"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$DH_TAG" | cut -d'@' -f2)
          mkdir -p digests status
          echo "$DIGEST" > "digests/dockerhub-${{ matrix.component }}.digest"
          echo "success" > "status/dockerhub-${{ matrix.component }}.status"
          echo "Retry pushed ${DH_TAG}" > "status/dockerhub-${{ matrix.component }}.reason"

      - name: Upload DockerHub status
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: retry-dockerhub-${{ matrix.component }}-${{ needs.validate.outputs.version }}
          path: |
            digests/
            status/
          retention-days: 1

      - name: Record DockerHub failure
        if: ${{ failure() }}
        run: |
          mkdir -p status
          echo "failure" > "status/dockerhub-${{ matrix.component }}.status"
          echo "DockerHub retry push failed for ${{ matrix.component }} (see job logs)" > "status/dockerhub-${{ matrix.component }}.reason"

      - name: Upload DockerHub failure status
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: retry-dockerhub-${{ matrix.component }}-${{ needs.validate.outputs.version }}
          path: status/
          retention-days: 1

  docker-push-ghcr:
    name: Retry push GHCR
    needs: [validate, docker-build]
    if: ${{ needs.validate.outputs.kind == 'docker' && inputs.retry_ghcr }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: ${{ fromJson(inputs.components) }}
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v8
        with:
          name: retry-docker-image-${{ matrix.component }}-${{ needs.validate.outputs.version }}

      - name: Load Docker image
        run: docker load < "docker-image-${{ matrix.component }}.tar.gz"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and Push to GHCR
        id: push
        run: |
          LOCAL_TAG="local/${{ inputs.image_base_name }}-${{ matrix.component }}:${{ needs.validate.outputs.version }}"
          GHCR_NS="${{ inputs.ghcr_namespace }}"
          if [[ -z "$GHCR_NS" ]]; then
            GHCR_NS="${{ github.repository_owner }}"
          fi
          GHCR_NS=$(echo "$GHCR_NS" | tr '[:upper:]' '[:lower:]')
          GHCR_TAG="ghcr.io/${GHCR_NS}/${{ inputs.image_base_name }}-${{ matrix.component }}:${{ needs.validate.outputs.version }}"
          docker tag "$LOCAL_TAG" "$GHCR_TAG"
          docker push "$GHCR_TAG"
          mkdir -p status
          echo "success" > "status/ghcr-${{ matrix.component }}.status"
          echo "Retry pushed ${GHCR_TAG}" > "status/ghcr-${{ matrix.component }}.reason"
          echo "Pushed to GHCR: $GHCR_TAG"

      - name: Record GHCR failure
        if: ${{ failure() }}
        run: |
          mkdir -p status
          echo "failure" > "status/ghcr-${{ matrix.component }}.status"
          echo "GHCR retry push failed for ${{ matrix.component }} (see job logs)" > "status/ghcr-${{ matrix.component }}.reason"

      - name: Upload GHCR status
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: retry-ghcr-${{ matrix.component }}-${{ needs.validate.outputs.version }}
          path: status/
          retention-days: 1
          if-no-files-found: ignore

  helm-push:
    name: Helm OCI retry
    needs: validate
    if: ${{ needs.validate.outputs.kind == 'helm' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      dh_status: ${{ steps.dh.outputs.status }}
      dh_reason: ${{ steps.dh.outputs.reason }}
      ghcr_status: ${{ steps.ghcr.outputs.status }}
      ghcr_reason: ${{ steps.ghcr.outputs.reason }}
      ghcr_ns: ${{ steps.ghcr.outputs.ghcr_ns }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.git_tag }}

      - name: Load HELM_VERSION from versions.env
        id: versions
        run: |
          # shellcheck source=scripts/load-versions-env.sh
          source scripts/load-versions-env.sh
          HELM_PIN="${HELM_VERSION#v}"
          if [[ -z "$HELM_PIN" ]]; then
            echo "::error::HELM_VERSION missing from versions.env" >&2
            exit 1
          fi
          echo "helm=${HELM_PIN}" >> "$GITHUB_OUTPUT"

      - uses: azure/setup-helm@v5
        with:
          version: ${{ steps.versions.outputs.helm }}

      - name: Download chart .tgz from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.git_tag }}"
          VER="${{ needs.validate.outputs.version }}"
          NAME="${{ inputs.chart_name }}"
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern "${NAME}-${VER}.tgz"
          if [[ ! -f "${NAME}-${VER}.tgz" ]]; then
            echo "::error::Release asset ${NAME}-${VER}.tgz not found on tag ${TAG}."
            exit 1
          fi
          echo "chart_package=${NAME}-${VER}.tgz" >> "$GITHUB_ENV"

      - name: Push Helm chart to Docker Hub
        id: push_dh
        if: ${{ inputs.retry_dockerhub }}
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "${DOCKERHUB_TOKEN}" | helm registry login -u "${DOCKERHUB_USER}" --password-stdin registry-1.docker.io
          helm push "${{ env.chart_package }}" "oci://registry-1.docker.io/${{ inputs.dockerhub_namespace }}"
          echo "status=success" >> "$GITHUB_OUTPUT"
          echo "reason=Retry pushed to oci://registry-1.docker.io/${{ inputs.dockerhub_namespace }}" >> "$GITHUB_OUTPUT"

      - name: Normalize DockerHub outcome
        id: dh
        run: |
          if [[ "${{ inputs.retry_dockerhub }}" != "true" ]]; then
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo "reason=retry_dockerhub=false" >> "$GITHUB_OUTPUT"
          elif [[ "${{ steps.push_dh.outcome }}" == "success" ]]; then
            echo "status=${{ steps.push_dh.outputs.status }}" >> "$GITHUB_OUTPUT"
            echo "reason=${{ steps.push_dh.outputs.reason }}" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "reason=DockerHub helm push failed — see job logs" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Push Helm chart to GHCR
        id: push_ghcr
        if: ${{ inputs.retry_ghcr }}
        run: |
          GHCR_NS="${{ inputs.ghcr_namespace }}"
          if [[ -z "$GHCR_NS" ]]; then
            GHCR_NS="${{ github.repository_owner }}"
          fi
          GHCR_NS=$(echo "$GHCR_NS" | tr '[:upper:]' '[:lower:]')
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login -u "${{ github.actor }}" --password-stdin ghcr.io
          helm push "${{ env.chart_package }}" "oci://ghcr.io/${GHCR_NS}"
          echo "ghcr_ns=${GHCR_NS}" >> "$GITHUB_OUTPUT"
          echo "status=success" >> "$GITHUB_OUTPUT"
          echo "reason=Retry pushed to oci://ghcr.io/${GHCR_NS}" >> "$GITHUB_OUTPUT"

      - name: Normalize GHCR outcome
        id: ghcr
        run: |
          if [[ "${{ inputs.retry_ghcr }}" != "true" ]]; then
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo "reason=retry_ghcr=false" >> "$GITHUB_OUTPUT"
            echo "ghcr_ns=" >> "$GITHUB_OUTPUT"
          elif [[ "${{ steps.push_ghcr.outcome }}" == "success" ]]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "reason=${{ steps.push_ghcr.outputs.reason }}" >> "$GITHUB_OUTPUT"
            echo "ghcr_ns=${{ steps.push_ghcr.outputs.ghcr_ns }}" >> "$GITHUB_OUTPUT"
          else
            GHCR_NS="${{ inputs.ghcr_namespace }}"
            if [[ -z "$GHCR_NS" ]]; then
              GHCR_NS="${{ github.repository_owner }}"
            fi
            GHCR_NS=$(echo "$GHCR_NS" | tr '[:upper:]' '[:lower:]')
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "reason=GHCR helm push failed — see job logs" >> "$GITHUB_OUTPUT"
            echo "ghcr_ns=${GHCR_NS}" >> "$GITHUB_OUTPUT"
            exit 1
          fi

  update-release-body:
    name: Update Release Registry status
    needs: [validate, docker-push-dockerhub, docker-push-ghcr, helm-push]
    if: ${{ always() && needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect Docker status artifacts
        if: ${{ needs.validate.outputs.kind == 'docker' }}
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: retry-dockerhub-*
          path: registry-meta
          merge-multiple: true

      - name: Collect GHCR status artifacts
        if: ${{ needs.validate.outputs.kind == 'docker' }}
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: retry-ghcr-*
          path: registry-meta
          merge-multiple: true

      - name: Build replacement Registry status section
        id: section
        env:
          KIND: ${{ needs.validate.outputs.kind }}
          VER: ${{ needs.validate.outputs.version }}
          COMPONENTS_JSON: ${{ inputs.components }}
          RETRY_DH: ${{ inputs.retry_dockerhub }}
          RETRY_GHCR: ${{ inputs.retry_ghcr }}
          DH_JOB: ${{ needs.docker-push-dockerhub.result }}
          GHCR_JOB: ${{ needs.docker-push-ghcr.result }}
          HELM_DH: ${{ needs.helm-push.outputs.dh_status }}
          HELM_DH_REASON: ${{ needs.helm-push.outputs.dh_reason }}
          HELM_GHCR: ${{ needs.helm-push.outputs.ghcr_status }}
          HELM_GHCR_REASON: ${{ needs.helm-push.outputs.ghcr_reason }}
          DH_NS: ${{ inputs.dockerhub_namespace }}
          IMG_BASE: ${{ inputs.image_base_name }}
          CHART_NAME: ${{ inputs.chart_name }}
          GHCR_INPUT: ${{ inputs.ghcr_namespace }}
          HELM_GHCR_NS: ${{ needs.helm-push.outputs.ghcr_ns }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          GHCR_NS="${GHCR_INPUT}"
          if [[ -z "$GHCR_NS" ]]; then GHCR_NS="${REPO_OWNER}"; fi
          GHCR_NS=$(echo "$GHCR_NS" | tr '[:upper:]' '[:lower:]')
          {
            echo "## Registry status"
            echo ""
            echo "_Updated by registry-retry workflow (run ${{ github.run_id }}) — no new git tag or Release was created._"
            echo ""
            if [[ "$KIND" == "docker" ]]; then
              echo "### DockerHub"
              echo ""
              if [[ "$RETRY_DH" != "true" ]]; then
                echo "- **Status:** \`skipped\` — retry_dockerhub=false"
              else
                echo "- **Job result:** \`${DH_JOB}\`"
                any=false
                while IFS= read -r comp; do
                  st=$(find registry-meta -type f -name "dockerhub-${comp}.status" 2>/dev/null | head -1 || true)
                  rs=$(find registry-meta -type f -name "dockerhub-${comp}.reason" 2>/dev/null | head -1 || true)
                  dg=$(find registry-meta -type f -name "dockerhub-${comp}.digest" 2>/dev/null | head -1 || true)
                  if [[ -n "$st" && -f "$st" ]]; then
                    any=true
                    status=$(tr -d '[:space:]' < "$st")
                    reason=""
                    [[ -n "$rs" && -f "$rs" ]] && reason=$(tr -d '\r' < "$rs")
                    echo "- **\`${comp}\`:** \`${status}\`${reason:+ — ${reason}}"
                    if [[ "$status" == "success" && -n "$dg" && -f "$dg" ]]; then
                      echo "  - digest: \`$(tr -d '[:space:]' < "$dg")\`"
                    fi
                  fi
                done < <(echo "$COMPONENTS_JSON" | jq -r '.[]')
                if [[ "$any" != "true" ]]; then
                  echo "- No per-component status artifacts (job \`${DH_JOB}\`)."
                fi
              fi
              echo ""
              echo "### GHCR"
              echo ""
              if [[ "$RETRY_GHCR" != "true" ]]; then
                echo "- **Status:** \`skipped\` — retry_ghcr=false"
              else
                echo "- **Job result:** \`${GHCR_JOB}\`"
                if [[ "$GHCR_JOB" == "success" ]]; then
                  echo "- Retry push succeeded for matrix components."
                  echo ""
                  echo '```bash'
                  echo "$COMPONENTS_JSON" | jq -r --arg ns "$GHCR_NS" --arg base "$IMG_BASE" --arg ver "$VER" \
                    '.[] | "docker pull ghcr.io/\($ns)/\($base)-\(.):\($ver)"'
                  echo '```'
                else
                  echo "- Retry push result \`${GHCR_JOB}\` — see DockerPush/GHCR job logs."
                fi
              fi
            else
              echo "### DockerHub"
              echo "- **Status:** \`${HELM_DH}\`"
              echo "- **Detail:** ${HELM_DH_REASON}"
              echo ""
              echo "### GHCR"
              echo "- **Status:** \`${HELM_GHCR}\`"
              echo "- **Detail:** ${HELM_GHCR_REASON}"
            fi
            echo ""
          } > new-registry-status.md

      - name: Replace Registry status in Release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.git_tag }}
        run: |
          gh release view "$TAG" --repo "${{ github.repository }}" --json body --jq .body > old-body.md
          python3 <<'PY'
          import pathlib
          import re

          old = pathlib.Path("old-body.md").read_text(encoding="utf-8")
          section = pathlib.Path("new-registry-status.md").read_text(encoding="utf-8").rstrip() + "\n"
          pat = re.compile(r"^## Registry status\n.*?(?=^## |\Z)", re.M | re.S)
          if pat.search(old):
              new = pat.sub(section + "\n", old, count=1)
          else:
              new = section + "\n" + old
          pathlib.Path("new-body.md").write_text(new, encoding="utf-8")
          PY
          gh release edit "$TAG" --repo "${{ github.repository }}" --notes-file new-body.md
          echo "Updated ## Registry status on release ${TAG}"
