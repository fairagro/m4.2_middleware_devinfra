# Canonical reusable code-quality for m4.2 product repos (issue #11).
# Call from the product repo: uses: fairagro/m4.2_middleware_devinfra/.github/workflows/reusable-code-quality.yml@<ref>
name: Reusable Code Quality

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      components:
        description: "JSON array of components (accepted for caller compatibility; unused by this workflow)"
        required: false
        type: string
        default: '["api"]'
      python_package_root:
        description: "Python package path to lint/test (relative to caller checkout)"
        required: false
        type: string
        default: "middleware"
      mypy_path:
        description: >-
          Optional MYPYPATH (colon-separated), e.g. stubs + package src roots.
          Empty keeps default mypy module discovery (fine for flat layouts).
        required: false
        type: string
        default: ""
      pylint_source_roots:
        description: >-
          Optional comma-separated --source-roots for pylint (same-dir test helpers).
          Empty omits the flag.
        required: false
        type: string
        default: ""
      skip:
        description: "Exit successfully without running checks (PRs with no code changes)"
        required: false
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  code-quality:
    # Branch ruleset "rules for main" requires this exact check name
    # (legacy matrix suffix). Keep it even without a python-version matrix.
    name: Code Quality Check (3.12)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: No code changes — skipping checks
        if: ${{ inputs.skip }}
        run: echo "No code files changed. Exiting with success."

      - name: Checkout code
        if: ${{ !inputs.skip }}
        uses: actions/checkout@v7

      - name: Read UV_VERSION from versions.env
        if: ${{ !inputs.skip }}
        id: uv-version
        run: |
          uv_version="$(awk -F= '/^UV_VERSION=/ {print $2; exit}' versions.env | tr -d '[:space:]')"
          if [[ -z "$uv_version" ]]; then
            echo "ERROR: UV_VERSION missing from versions.env" >&2
            exit 1
          fi
          echo "version=$uv_version" >> "$GITHUB_OUTPUT"

      - name: Install uv
        if: ${{ !inputs.skip }}
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ steps.uv-version.outputs.version }}

      # Must run before load-versions-env.sh (which rewrites .python-version).
      - name: Assert .python-version matches versions.env
        if: ${{ !inputs.skip }}
        run: |
          expected="$(awk -F= '/^PYTHON_VERSION=/ {print $2; exit}' versions.env | tr -d '[:space:]')"
          actual="$(tr -d '[:space:]' < .python-version)"
          if [[ -z "$expected" || "$expected" != "$actual" ]]; then
            echo "ERROR: .python-version ('${actual}') != PYTHON_VERSION in versions.env ('${expected}')" >&2
            echo "Keep both in sync (Renovate updates both; or: source scripts/load-versions-env.sh && git add .python-version)." >&2
            exit 1
          fi

      - name: Install Python from versions.env
        if: ${{ !inputs.skip }}
        run: |
          # shellcheck source=scripts/load-versions-env.sh
          source scripts/load-versions-env.sh
          uv python install "${PYTHON_VERSION}"

      - name: Install dependencies
        if: ${{ !inputs.skip }}
        run: uv sync --dev --all-packages

      - name: Code formatting and linting
        if: ${{ !inputs.skip }}
        env:
          PKG: ${{ inputs.python_package_root }}
          MYPY_PATH_INPUT: ${{ inputs.mypy_path }}
          PYLINT_SOURCE_ROOTS: ${{ inputs.pylint_source_roots }}
        run: |
          uv run ruff format --check --diff --config ruff.toml "${PKG}"
          uv run ruff check --config ruff.toml "${PKG}"
          pylint_args=(--rcfile .pylintrc)
          if [[ -n "${PYLINT_SOURCE_ROOTS}" ]]; then
            pylint_args+=(--source-roots="${PYLINT_SOURCE_ROOTS}")
          fi
          uv run pylint "${pylint_args[@]}" "${PKG}"
          if [[ -n "${MYPY_PATH_INPUT}" ]]; then
            export MYPYPATH="${MYPY_PATH_INPUT}"
          fi
          uv run mypy --config-file mypy.ini "${PKG}"

      - name: Security check with bandit
        if: ${{ !inputs.skip }}
        env:
          PKG: ${{ inputs.python_package_root }}
        run: |
          # Log all severities; fail only on MEDIUM/HIGH (hooks use -ll for the same fail bar).
          # Severity gate is CLI: `.bandit` has no fail-on-severity key (see docs/quality.md).
          uv run bandit -r "${PKG}" -c .bandit -f json -o bandit-report.json --exit-zero
          python3 <<'PY'
          import json, sys
          with open("bandit-report.json") as f:
              data = json.load(f)
          for r in data.get("results", []):
              print(f"  [{r['issue_severity']:6}] {r['filename']}:{r['line_number']}: {r['issue_text']}")
          t = data.get("metrics", {}).get("_totals", {})
          low = int(t.get("SEVERITY.LOW", 0) or 0)
          med = int(t.get("SEVERITY.MEDIUM", 0) or 0)
          high = int(t.get("SEVERITY.HIGH", 0) or 0)
          print(f"Bandit findings: LOW={low}, MEDIUM={med}, HIGH={high}")
          if med + high > 0:
              print(f"Failing: {med + high} MEDIUM/HIGH finding(s) found.")
              sys.exit(1)
          PY

      - name: Run tests
        if: ${{ !inputs.skip }}
        env:
          PKG: ${{ inputs.python_package_root }}
        run: uv run pytest "${PKG}" -v --junitxml=pytest-report.xml
