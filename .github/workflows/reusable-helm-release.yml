# Canonical reusable Helm chart final release for m4.2 product repos (issue #12).
# Thin product caller: workflow_dispatch → uses this file with chart_dir / chart_name inputs.
# Requires a prior Docker release tag matching *-docker-v* (for chart appVersion).
# Keep reusable-release tag_prefix at docker-v so this discovery matches.
name: Reusable Helm Release

concurrency:
  group: ${{ github.repository }}-reusable-helm-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

on:
  workflow_call:
    inputs:
      version_bump:
        description: "Chart version bump: major, minor, or patch"
        required: false
        type: string
        default: "patch"
      chart_dir:
        description: "Path to the chart directory in the caller checkout"
        required: true
        type: string
      chart_name:
        description: "Chart name (OCI repository name)"
        required: true
        type: string
      dockerhub_namespace:
        description: "Docker Hub namespace for OCI push"
        required: false
        type: string
        default: "zalf"
      ghcr_namespace:
        description: "GHCR namespace (owner); empty defaults to github.repository_owner"
        required: false
        type: string
        default: ""
      require_main:
        description: "Fail unless github.ref_name is main"
        required: false
        type: boolean
        default: true
      create_github_release:
        description: "Create a GitHub release for the chart tag"
        required: false
        type: boolean
        default: true
      helm_install_name:
        description: "Example release name used in install docs"
        required: false
        type: string
        default: "fairagro-middleware"
    secrets:
      DOCKERHUB_USER:
        required: false
      DOCKERHUB_TOKEN:
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-branch:
    name: Validate Branch
    runs-on: ubuntu-latest
    steps:
      - name: Assert main branch
        if: ${{ inputs.require_main }}
        run: |
          if [[ "${{ github.ref_name }}" != "main" ]]; then
            echo "::error::Helm chart final release requires the main branch (got '${{ github.ref_name }}')."
            exit 1
          fi

      - name: Branch check skipped
        if: ${{ !inputs.require_main }}
        run: echo "require_main=false; continuing on ${{ github.ref_name }}"

  version:
    name: Determine Version
    needs: validate-branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.calc-version.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculate next chart version
        id: calc-version
        run: |
          LATEST_CHART_VERSION=$(git tag --list '*-chart-v*' \
            | grep -E '^[0-9]+-chart-v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed 's/^[0-9]*-chart-v//' \
            | sort -V \
            | tail -1 || true)
          if [ -z "$LATEST_CHART_VERSION" ]; then LATEST_CHART_VERSION="0.0.0"; fi

          MAJOR=$(echo "$LATEST_CHART_VERSION" | cut -d. -f1)
          MINOR=$(echo "$LATEST_CHART_VERSION" | cut -d. -f2)
          PATCH=$(echo "$LATEST_CHART_VERSION" | cut -d. -f3)

          case "${{ inputs.version_bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            *)     PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Report version to summary
        run: |
          echo "## Helm Chart Release Version" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Type | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Chart Version** | \`${{ steps.calc-version.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"

  helm-release:
    name: Release
    needs: [version, validate-branch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    env:
      CHART_VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Generate timestamp
        id: timestamp
        run: echo "value=$(date +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate chart_name matches Chart.yaml
        run: |
          actual=$(grep -E '^name:' "${{ inputs.chart_dir }}/Chart.yaml" | head -1 \
            | sed -E 's/^name:[[:space:]]*//; s/[\"'\'']//g; s/[[:space:]]*$//')
          expected="${{ inputs.chart_name }}"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::chart_name input '${expected}' does not match Chart.yaml name '${actual}'"
            exit 1
          fi

      - name: Load HELM_VERSION from versions.env
        id: versions
        run: |
          # shellcheck source=scripts/load-versions-env.sh
          source scripts/load-versions-env.sh
          HELM_PIN="${HELM_VERSION#v}"
          if [[ -z "$HELM_PIN" ]]; then
            echo "::error::HELM_VERSION missing from versions.env" >&2
            exit 1
          fi
          echo "helm=${HELM_PIN}" >> "$GITHUB_OUTPUT"

      - uses: azure/setup-helm@v5
        with:
          version: ${{ steps.versions.outputs.helm }}

      - name: Detect current Docker release version
        id: docker-version
        run: |
          LATEST=$(git tag --list '*-docker-v*' \
            | grep -E '^[0-9]+-docker-v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed 's/^[0-9]*-docker-v//' \
            | sort -V \
            | tail -1 || true)
          if [ -z "$LATEST" ]; then
            echo "::error::No docker release tag found. Publish a Docker image first."
            exit 1
          fi
          echo "value=${LATEST}" >> "$GITHUB_OUTPUT"

      - name: Update Chart.yaml version
        run: |
          sed -i "s/^version:.*/version: ${{ env.CHART_VERSION }}/" "${{ inputs.chart_dir }}/Chart.yaml"
          echo "Chart.yaml version set to ${{ env.CHART_VERSION }}"

      - name: Package Helm chart
        id: package_chart
        run: |
          helm package "./${{ inputs.chart_dir }}" \
            --version "${{ env.CHART_VERSION }}" \
            --app-version "${{ steps.docker-version.outputs.value }}"
          CHART_PACKAGE=$(ls *.tgz | head -1)
          echo "chart-package=$CHART_PACKAGE" >> "$GITHUB_OUTPUT"

      - name: Create version tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: ${{ steps.timestamp.outputs.value }}-chart-v${{ env.CHART_VERSION }}
          tag_prefix: ""
          create_annotated_tag: true

      - name: Upload chart package artifact
        uses: actions/upload-artifact@v7
        with:
          name: helm-chart-${{ env.CHART_VERSION }}
          path: ${{ steps.package_chart.outputs.chart-package }}
          retention-days: 1

    outputs:
      timestamp: ${{ steps.timestamp.outputs.value }}
      chart_package: ${{ steps.package_chart.outputs.chart-package }}
      app_version: ${{ steps.docker-version.outputs.value }}
      helm_version: ${{ steps.versions.outputs.helm }}

  helm-push:
    name: OCI push
    needs: [version, helm-release]
    uses: $/.github/workflows/reusable-helm-oci-push.yml
    with:
      chart_artifact_name: helm-chart-${{ needs.version.outputs.version }}
      chart_package: ${{ needs.helm-release.outputs.chart_package }}
      push_dockerhub: true
      push_ghcr: true
      dockerhub_namespace: ${{ inputs.dockerhub_namespace }}
      ghcr_namespace: ${{ inputs.ghcr_namespace }}
      soft_skip_missing_dockerhub: true
      soft_fail: true
      helm_version: ${{ needs.helm-release.outputs.helm_version }}
      success_reason_prefix: Pushed
    secrets: inherit

  github-release:
    name: GitHub Release
    if: ${{ inputs.create_github_release }}
    needs: [version, helm-release, helm-push]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download chart package
        uses: actions/download-artifact@v8
        with:
          name: helm-chart-${{ needs.version.outputs.version }}

      - name: Write release body
        env:
          CHART_VERSION: ${{ needs.version.outputs.version }}
          APP_VERSION: ${{ needs.helm-release.outputs.app_version }}
          DH_STATUS: ${{ needs.helm-push.outputs.dh_status }}
          DH_REASON: ${{ needs.helm-push.outputs.dh_reason }}
          GHCR_STATUS: ${{ needs.helm-push.outputs.ghcr_status }}
          GHCR_REASON: ${{ needs.helm-push.outputs.ghcr_reason }}
          HELM_INSTALL_NAME: ${{ inputs.helm_install_name }}
          DOCKERHUB_NAMESPACE: ${{ inputs.dockerhub_namespace }}
          CHART_NAME: ${{ inputs.chart_name }}
          GHCR_OWNER: ${{ needs.helm-push.outputs.ghcr_ns }}
        run: |
          {
            echo "## Helm Chart Release v${CHART_VERSION}"
            echo ""
            echo "**Chart Version**: \`${CHART_VERSION}\`"
            echo "**App Version (Docker image tag)**: \`${APP_VERSION}\`"
            echo ""
            echo "## Registry status"
            echo ""
            echo "Chart git tags / this GitHub Release are created even when a registry push fails or is skipped."
            echo "Re-publish to registries is a follow-up (retry workflow)."
            echo ""
            echo "### DockerHub"
            echo "- **Status:** \`${DH_STATUS}\`"
            echo "- **Detail:** ${DH_REASON}"
            echo ""
            echo "### GHCR"
            echo "- **Status:** \`${GHCR_STATUS}\`"
            echo "- **Detail:** ${GHCR_REASON}"
            echo ""
            echo "### Install via OCI registry (Docker Hub)"
            if [[ "${DH_STATUS}" == "success" ]]; then
              echo '```bash'
              echo "helm upgrade --install ${HELM_INSTALL_NAME} \\"
              echo "  oci://registry-1.docker.io/${DOCKERHUB_NAMESPACE}/${CHART_NAME} \\"
              echo "  --version ${CHART_VERSION}"
              echo '```'
            else
              echo "_Not published to DockerHub for this release (see Registry status)._"
            fi
            echo ""
            echo "### Install via OCI registry (GHCR)"
            if [[ "${GHCR_STATUS}" == "success" ]]; then
              echo '```bash'
              echo "helm upgrade --install ${HELM_INSTALL_NAME} \\"
              echo "  oci://ghcr.io/${GHCR_OWNER}/${CHART_NAME} \\"
              echo "  --version ${CHART_VERSION}"
              echo '```'
            else
              echo "_Not published to GHCR for this release (see Registry status)._"
            fi
            echo ""
            echo "### Fallback (install from attached file)"
            echo "Download the \`.tgz\` attached to this release, then:"
            echo '```bash'
            echo "helm upgrade --install ${HELM_INSTALL_NAME} \\"
            echo "  ${CHART_NAME}-${CHART_VERSION}.tgz"
            echo '```'
          } > release-body.md

      - name: Create GitHub Release (Draft)
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.helm-release.outputs.timestamp }}-chart-v${{ needs.version.outputs.version }}
          name: chart-v${{ needs.version.outputs.version }}
          body_path: release-body.md
          files: ${{ needs.helm-release.outputs.chart_package }}
          draft: true
          prerelease: false
          generate_release_notes: true
          make_latest: true

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.helm-release.outputs.timestamp }}-chart-v${{ needs.version.outputs.version }}"
          sleep 5
          if RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases/tags/${TAG}" --jq '.id' 2>/dev/null); then
            true
          else
            RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases" --jq ".[] | select(.tag_name == \"${TAG}\") | .id")
            if [[ -z "$RELEASE_ID" ]]; then
              echo "Release not found for tag $TAG" >&2
              exit 1
            fi
          fi
          gh api "repos/${{ github.repository }}/releases/$RELEASE_ID" \
            --method PATCH \
            --field draft=false
