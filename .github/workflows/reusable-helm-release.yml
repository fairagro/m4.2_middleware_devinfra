# Canonical reusable Helm chart final release for m4.2 product repos (issue #12).
# Thin product caller: workflow_dispatch → uses this file with chart_dir / chart_name inputs.
# Requires a prior Docker release tag matching *-docker-vX.Y.Z (for chart appVersion).
name: Reusable Helm Release

permissions:
  contents: write
  packages: write

on:
  workflow_call:
    inputs:
      version_bump:
        description: "Chart version bump: major, minor, or patch"
        required: false
        type: string
        default: "patch"
      chart_dir:
        description: "Path to the chart directory in the caller checkout"
        required: true
        type: string
      chart_name:
        description: "Chart name (OCI repository name)"
        required: true
        type: string
      dockerhub_namespace:
        description: "Docker Hub namespace for OCI push"
        required: false
        type: string
        default: "zalf"
      require_main:
        description: "Fail unless github.ref_name is main"
        required: false
        type: boolean
        default: true
      create_github_release:
        description: "Create a GitHub release for the chart tag"
        required: false
        type: boolean
        default: true
      helm_install_name:
        description: "Example release name used in install docs"
        required: false
        type: string
        default: "fairagro-middleware"
    secrets:
      DOCKERHUB_USER:
        required: false
      DOCKERHUB_TOKEN:
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-branch:
    name: Validate Branch
    runs-on: ubuntu-latest
    steps:
      - name: Assert main branch
        if: ${{ inputs.require_main }}
        run: |
          if [[ "${{ github.ref_name }}" != "main" ]]; then
            echo "::error::Helm chart final release requires the main branch (got '${{ github.ref_name }}')."
            exit 1
          fi

      - name: Branch check skipped
        if: ${{ !inputs.require_main }}
        run: echo "require_main=false; continuing on ${{ github.ref_name }}"

  version:
    name: Determine Version
    needs: validate-branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.calc-version.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculate next chart version
        id: calc-version
        run: |
          LATEST_CHART_VERSION=$(git tag --list '*-chart-v*' \
            | grep -E '^[0-9]+-chart-v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed 's/^[0-9]*-chart-v//' \
            | sort -V \
            | tail -1)
          if [ -z "$LATEST_CHART_VERSION" ]; then LATEST_CHART_VERSION="0.0.0"; fi

          MAJOR=$(echo "$LATEST_CHART_VERSION" | cut -d. -f1)
          MINOR=$(echo "$LATEST_CHART_VERSION" | cut -d. -f2)
          PATCH=$(echo "$LATEST_CHART_VERSION" | cut -d. -f3)

          case "${{ inputs.version_bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            *)     PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Report version to summary
        run: |
          echo "## Helm Chart Release Version" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Type | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Chart Version** | \`${{ steps.calc-version.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"

  helm-release:
    name: Release
    needs: [version, validate-branch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    env:
      CHART_VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Generate timestamp
        id: timestamp
        run: echo "value=$(date +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate chart_name matches Chart.yaml
        run: |
          actual=$(grep -E '^name:' "${{ inputs.chart_dir }}/Chart.yaml" | head -1 \
            | sed -E 's/^name:[[:space:]]*//; s/[\"'\'']//g; s/[[:space:]]*$//')
          expected="${{ inputs.chart_name }}"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::chart_name input '${expected}' does not match Chart.yaml name '${actual}'"
            exit 1
          fi

      - name: Load HELM_VERSION from versions.env
        id: versions
        run: |
          # shellcheck source=scripts/load-versions-env.sh
          source scripts/load-versions-env.sh
          HELM_PIN="${HELM_VERSION#v}"
          if [[ -z "$HELM_PIN" ]]; then
            echo "::error::HELM_VERSION missing from versions.env" >&2
            exit 1
          fi
          echo "helm=${HELM_PIN}" >> "$GITHUB_OUTPUT"

      - uses: azure/setup-helm@v5
        with:
          version: ${{ steps.versions.outputs.helm }}

      - name: Detect current Docker release version
        id: docker-version
        run: |
          LATEST=$(git tag --list '*-docker-v*' \
            | grep -E '^[0-9]+-docker-v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed 's/^[0-9]*-docker-v//' \
            | sort -V \
            | tail -1)
          if [ -z "$LATEST" ]; then
            echo "::error::No docker release tag found. Publish a Docker image first."
            exit 1
          fi
          echo "value=${LATEST}" >> "$GITHUB_OUTPUT"

      - name: Update Chart.yaml version
        run: |
          sed -i "s/^version:.*/version: ${{ env.CHART_VERSION }}/" "${{ inputs.chart_dir }}/Chart.yaml"
          echo "Chart.yaml version set to ${{ env.CHART_VERSION }}"

      - name: Package Helm chart
        id: package_chart
        run: |
          helm package "./${{ inputs.chart_dir }}" \
            --version "${{ env.CHART_VERSION }}" \
            --app-version "${{ steps.docker-version.outputs.value }}"
          CHART_PACKAGE=$(ls *.tgz | head -1)
          echo "chart-package=$CHART_PACKAGE" >> "$GITHUB_OUTPUT"

      - name: Create version tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: ${{ steps.timestamp.outputs.value }}-chart-v${{ env.CHART_VERSION }}
          tag_prefix: ""
          create_annotated_tag: true

      - name: Push Helm chart to Docker Hub
        id: push_dh
        continue-on-error: true
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "${DOCKERHUB_USER}" || -z "${DOCKERHUB_TOKEN}" ]]; then
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo "reason=DOCKERHUB_USER and/or DOCKERHUB_TOKEN secrets were not provided to this reusable workflow call" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "${DOCKERHUB_TOKEN}" | helm registry login -u "${DOCKERHUB_USER}" --password-stdin registry-1.docker.io
          helm push "${{ steps.package_chart.outputs.chart-package }}" \
            "oci://registry-1.docker.io/${{ inputs.dockerhub_namespace }}"
          echo "status=success" >> "$GITHUB_OUTPUT"
          echo "reason=Pushed to oci://registry-1.docker.io/${{ inputs.dockerhub_namespace }}" >> "$GITHUB_OUTPUT"
          echo "Pushed Helm chart to Docker Hub"

      - name: Normalize DockerHub push outcome
        id: dh
        run: |
          if [[ -n "${{ steps.push_dh.outputs.status }}" ]]; then
            echo "status=${{ steps.push_dh.outputs.status }}" >> "$GITHUB_OUTPUT"
            echo "reason=${{ steps.push_dh.outputs.reason }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ steps.push_dh.outcome }}" == "failure" ]]; then
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "reason=DockerHub login/push failed — see job logs" >> "$GITHUB_OUTPUT"
          else
            echo "status=${{ steps.push_dh.outcome }}" >> "$GITHUB_OUTPUT"
            echo "reason=DockerHub push did not complete successfully" >> "$GITHUB_OUTPUT"
          fi

      - name: Push Helm chart to GHCR
        id: push_ghcr
        continue-on-error: true
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login \
            -u "${{ github.actor }}" --password-stdin ghcr.io
          helm push "${{ steps.package_chart.outputs.chart-package }}" \
            "oci://ghcr.io/${{ github.repository_owner }}"
          echo "Pushed Helm chart to GHCR"

      - name: Normalize GHCR push outcome
        id: ghcr
        run: |
          if [[ "${{ steps.push_ghcr.outcome }}" == "success" ]]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "reason=Pushed to oci://ghcr.io/${{ github.repository_owner }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ steps.push_ghcr.outcome }}" == "failure" ]]; then
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "reason=GHCR login/push failed — see job logs" >> "$GITHUB_OUTPUT"
          else
            echo "status=${{ steps.push_ghcr.outcome }}" >> "$GITHUB_OUTPUT"
            echo "reason=GHCR push did not complete successfully" >> "$GITHUB_OUTPUT"
          fi

      - name: Write release body
        if: ${{ inputs.create_github_release }}
        env:
          CHART_VERSION: ${{ env.CHART_VERSION }}
          APP_VERSION: ${{ steps.docker-version.outputs.value }}
          DH_STATUS: ${{ steps.dh.outputs.status }}
          DH_REASON: ${{ steps.dh.outputs.reason }}
          GHCR_STATUS: ${{ steps.ghcr.outputs.status }}
          GHCR_REASON: ${{ steps.ghcr.outputs.reason }}
          HELM_INSTALL_NAME: ${{ inputs.helm_install_name }}
          DOCKERHUB_NAMESPACE: ${{ inputs.dockerhub_namespace }}
          CHART_NAME: ${{ inputs.chart_name }}
          GHCR_OWNER: ${{ github.repository_owner }}
        run: |
          {
            echo "## Helm Chart Release v${CHART_VERSION}"
            echo ""
            echo "**Chart Version**: \`${CHART_VERSION}\`"
            echo "**App Version (Docker image tag)**: \`${APP_VERSION}\`"
            echo ""
            echo "## Registry status"
            echo ""
            echo "Chart git tags / this GitHub Release are created even when a registry push fails or is skipped."
            echo "Re-publish to registries is a follow-up (retry workflow)."
            echo ""
            echo "### DockerHub"
            echo "- **Status:** \`${DH_STATUS}\`"
            echo "- **Detail:** ${DH_REASON}"
            echo ""
            echo "### GHCR"
            echo "- **Status:** \`${GHCR_STATUS}\`"
            echo "- **Detail:** ${GHCR_REASON}"
            echo ""
            echo "### Install via OCI registry (Docker Hub)"
            if [[ "${DH_STATUS}" == "success" ]]; then
              echo '```bash'
              echo "helm upgrade --install ${HELM_INSTALL_NAME} \\"
              echo "  oci://registry-1.docker.io/${DOCKERHUB_NAMESPACE}/${CHART_NAME} \\"
              echo "  --version ${CHART_VERSION}"
              echo '```'
            else
              echo "_Not published to DockerHub for this release (see Registry status)._"
            fi
            echo ""
            echo "### Install via OCI registry (GHCR)"
            if [[ "${GHCR_STATUS}" == "success" ]]; then
              echo '```bash'
              echo "helm upgrade --install ${HELM_INSTALL_NAME} \\"
              echo "  oci://ghcr.io/${GHCR_OWNER}/${CHART_NAME} \\"
              echo "  --version ${CHART_VERSION}"
              echo '```'
            else
              echo "_Not published to GHCR for this release (see Registry status)._"
            fi
            echo ""
            echo "### Fallback (install from attached file)"
            echo "Download the \`.tgz\` attached to this release, then:"
            echo '```bash'
            echo "helm upgrade --install ${HELM_INSTALL_NAME} \\"
            echo "  ${CHART_NAME}-${CHART_VERSION}.tgz"
            echo '```'
          } > release-body.md

      - name: Create GitHub Release (Draft)
        if: ${{ inputs.create_github_release }}
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.timestamp.outputs.value }}-chart-v${{ env.CHART_VERSION }}
          name: chart-v${{ env.CHART_VERSION }}
          body_path: release-body.md
          files: ${{ steps.package_chart.outputs.chart-package }}
          draft: true
          prerelease: false
          generate_release_notes: true
          make_latest: true

      - name: Publish Release
        if: ${{ inputs.create_github_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.timestamp.outputs.value }}-chart-v${{ env.CHART_VERSION }}"
          sleep 5
          if RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases/tags/${TAG}" --jq '.id' 2>/dev/null); then
            true
          else
            RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases" --jq ".[] | select(.tag_name == \"${TAG}\") | .id")
            if [[ -z "$RELEASE_ID" ]]; then
              echo "Release not found for tag $TAG" >&2
              exit 1
            fi
          fi
          gh api "repos/${{ github.repository }}/releases/$RELEASE_ID" \
            --method PATCH \
            --field draft=false
