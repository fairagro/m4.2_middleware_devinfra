# Canonical reusable Docker release for m4.2 product repos (issue #12).
# Call from the product repo:
#   uses: fairagro/m4.2_middleware_devinfra/.github/workflows/reusable-release.yml@<ref>
#
# Consumes build artifacts from reusable-build.yml (same workflow run).
# Does not publish to PyPI — keep PyPI jobs in the product repo (API-local).
name: Reusable Release

concurrency:
  group: ${{ github.repository }}-reusable-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

on:
  workflow_call:
    inputs:
      version:
        description: "Version calculated in Build phase"
        required: true
        type: string
      pep440_version:
        description: "PEP 440 version (accepted for caller compatibility; unused — no PyPI in this workflow)"
        required: false
        type: string
        default: ""
      components:
        description: "JSON array of components to release (required; no product default)"
        required: true
        type: string
      image_base_name:
        description: "Image name prefix matching build tags (local/<prefix>-<component>:<version>)"
        required: false
        type: string
        default: "fairagro-advanced-middleware"
      dockerhub_namespace:
        description: "Docker Hub namespace / organization"
        required: false
        type: string
        default: "zalf"
      ghcr_namespace:
        description: "GHCR namespace (owner); empty defaults to github.repository_owner"
        required: false
        type: string
        default: ""
      release_type:
        description: "Type of release (feature or final)"
        required: true
        type: string
      create_github_release:
        description: "Whether to create the git release tag and GitHub Release (false: image pushes only)"
        required: false
        type: boolean
        default: true
      tag_prefix:
        description: "Prefix for the git release tag (must stay docker-v for shared Helm appVersion discovery)"
        required: false
        type: string
        default: "docker-v"
      skip:
        description: "Exit successfully without releasing"
        required: false
        type: boolean
        default: false
    secrets:
      DOCKERHUB_USER:
        required: false
      DOCKERHUB_TOKEN:
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  push-dockerhub:
    name: DockerPush/DockerHub
    uses: $/.github/workflows/reusable-docker-registry-push.yml
    with:
      version: ${{ inputs.version }}
      components: ${{ inputs.components }}
      image_base_name: ${{ inputs.image_base_name }}
      dockerhub_namespace: ${{ inputs.dockerhub_namespace }}
      ghcr_namespace: ${{ inputs.ghcr_namespace }}
      push_dockerhub: true
      push_ghcr: false
      image_artifact_prefix: docker-image
      status_artifact_prefix: dockerhub
      soft_skip_missing_dockerhub: true
      write_ghcr_status: false
      success_reason_prefix: Pushed
      skip: ${{ inputs.skip }}
    secrets: inherit

  push-ghcr:
    name: DockerPush/GHCR
    uses: $/.github/workflows/reusable-docker-registry-push.yml
    with:
      version: ${{ inputs.version }}
      components: ${{ inputs.components }}
      image_base_name: ${{ inputs.image_base_name }}
      dockerhub_namespace: ${{ inputs.dockerhub_namespace }}
      ghcr_namespace: ${{ inputs.ghcr_namespace }}
      push_dockerhub: false
      push_ghcr: true
      image_artifact_prefix: docker-image
      status_artifact_prefix: dockerhub
      soft_skip_missing_dockerhub: true
      write_ghcr_status: false
      success_reason_prefix: Pushed
      skip: ${{ inputs.skip }}
    secrets: inherit

  license-report:
    name: License Report
    # Informational Trivy license inventory for the GitHub Release body (issue #74). Must not fail on findings.
    if: ${{ !inputs.skip && inputs.create_github_release }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: ${{ fromJson(inputs.components) }}
    permissions:
      contents: read

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v8
        with:
          name: docker-image-${{ matrix.component }}-${{ inputs.version }}

      - name: Load Docker image
        run: docker load < "docker-image-${{ matrix.component }}.tar.gz"

      - name: Run Trivy licence scanner (JSON)
        # Informational: do not fail the job on Trivy infra/schema errors (issue #74 / review).
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: local/${{ inputs.image_base_name }}-${{ matrix.component }}:${{ inputs.version }}
          format: "json"
          output: "trivy-license-${{ matrix.component }}.json"
          scan-type: "image"
          scanners: "license"
          exit-code: "0"

      - name: Format license Markdown
        # Informational: tolerate missing/malformed JSON so release creation stays green.
        continue-on-error: true
        env:
          COMPONENT: ${{ matrix.component }}
          MAX_ROWS: "80"
        run: |
          set -euo pipefail
          JSON="trivy-license-${COMPONENT}.json"
          OUT="license-${COMPONENT}.md"
          {
            echo "### \`${COMPONENT}\`"
            echo ""
            if [[ ! -f "$JSON" ]]; then
              echo "_No Trivy license JSON produced._"
              echo ""
              exit 0
            fi
            if ! jq -r --argjson max "${MAX_ROWS}" '
              [
                .Results[]? | (.Licenses // [])[]
                | {
                    pkg: (.PkgName // .FilePath // "?"),
                    lic: (.Name // "?"),
                    cat: (.Category // .Severity // "?")
                  }
              ] as $all
              | ($all | unique_by(.pkg + "|" + .lic + "|" + .cat)) as $rows
              | ($rows | group_by(.cat) | map({cat: .[0].cat, n: length}) | sort_by(.cat)) as $counts
              | (
                  if ($counts | length) == 0 then
                    "_No license findings._\n"
                  else
                    (["**Counts by classification**", ""] + ($counts | map("- **\(.cat):** \(.n)")) + [""]) | join("\n")
                  end
                ),
              (
                if ($rows | length) == 0 then empty
                else
                  ["| Package | License | Classification |", "| --- | --- | --- |"]
                  + ($rows[0:$max] | map("| `\(.pkg)` | `\(.lic)` | \(.cat) |")),
                  (if ($rows | length) > $max
                   then ["", "_Truncated to \($max) rows; see the License Report job log / JSON for the full list._", ""]
                   else [""] end)
                  | join("\n")
                end
              )
            ' "$JSON"; then
              echo "_License Markdown formatting failed (see job log); release continues without a table._"
              echo ""
            fi
            echo ""
          } > "$OUT"

      - name: Upload license Markdown
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: license-md-${{ matrix.component }}-${{ inputs.version }}
          path: license-${{ matrix.component }}.md
          if-no-files-found: ignore

  create-release-tag:
    name: CreateReleaseTag/Release
    # Intentional: GitHub-internal identity (tag) first; registry push may fail afterward.
    # github-release documents push outcomes in the release body.
    if: ${{ !inputs.skip && inputs.create_github_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      timestamp: ${{ steps.timestamp.outputs.value }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate timestamp
        id: timestamp
        run: echo "value=$(date +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Create version tag
        uses: mathieudutour/github-tag-action@v7.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: ${{ steps.timestamp.outputs.value }}-${{ inputs.tag_prefix }}${{ inputs.version }}
          tag_prefix: ""

  github-release:
    name: GitHubRelease/Release
    if: ${{ always() && !inputs.skip && inputs.create_github_release == true && needs.create-release-tag.result == 'success' }}
    needs: [push-dockerhub, push-ghcr, create-release-tag, license-report]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download SBOM artifacts
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: sbom-*
          merge-multiple: true
          path: sboms

      - name: Download DockerHub digest/status artifacts
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: dockerhub-*
          merge-multiple: true
          path: dockerhub-meta

      - name: Download license Markdown artifacts
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: license-md-*
          merge-multiple: true
          path: license-md

      - name: Generate release body
        run: |
          COMPONENTS_JSON='${{ inputs.components }}'
          COMPONENT=$(echo "$COMPONENTS_JSON" | jq -r '.[0] // empty')
          if [[ -z "$COMPONENT" || "$COMPONENT" == "null" ]]; then
            echo "::error::reusable-release requires a non-empty components JSON array (got: ${COMPONENTS_JSON})" >&2
            exit 1
          fi
          DH_NS="${{ inputs.dockerhub_namespace }}"
          IMG_BASE="${{ inputs.image_base_name }}"
          VER="${{ inputs.version }}"
          PEP440="${{ inputs.pep440_version }}"
          if [[ -z "$PEP440" || "$PEP440" == "null" ]]; then
            PEP440="${VER}"
          fi
          GHCR_NS="${{ inputs.ghcr_namespace }}"
          if [[ -z "$GHCR_NS" ]]; then
            GHCR_NS="${{ github.repository_owner }}"
          fi
          GHCR_NS=$(echo "$GHCR_NS" | tr '[:upper:]' '[:lower:]')
          TAG="${{ needs.create-release-tag.outputs.timestamp }}-${{ inputs.tag_prefix }}${{ inputs.version }}"
          REPO_BASENAME=$(basename "${{ github.repository }}")
          DH_JOB="${{ needs.push-dockerhub.result }}"
          GHCR_JOB="${{ needs.push-ghcr.result }}"

          {
            echo "## Registry status"
            echo ""
            echo "Git tags / this GitHub Release are created even when a registry push fails or is skipped."
            echo "Re-publish to registries is tracked as a follow-up (retry workflow)."
            echo ""

            echo "### DockerHub"
            echo ""
            echo "- **Job result:** \`${DH_JOB}\`"
            any_dh=false
            while IFS= read -r comp; do
              st=$(find dockerhub-meta -type f -name "dockerhub-${comp}.status" 2>/dev/null | head -1)
              rs=$(find dockerhub-meta -type f -name "dockerhub-${comp}.reason" 2>/dev/null | head -1)
              dg=$(find dockerhub-meta -type f -name "dockerhub-${comp}.digest" 2>/dev/null | head -1)
              if [[ -n "$st" && -f "$st" ]]; then
                any_dh=true
                status=$(tr -d '[:space:]' < "$st")
                reason=""
                if [[ -n "$rs" && -f "$rs" ]]; then
                  reason=$(tr -d '\r' < "$rs" 2>/dev/null || true)
                fi
                echo "- **\`${comp}\`:** \`${status}\`${reason:+ — ${reason}}"
                if [[ "$status" == "success" && -n "$dg" && -f "$dg" ]]; then
                  echo "  - digest: \`$(tr -d '[:space:]' < "$dg")\`"
                fi
              fi
            done < <(echo "$COMPONENTS_JSON" | jq -r '.[]')
            if [[ "$any_dh" != "true" ]]; then
              if [[ "$DH_JOB" == "failure" ]]; then
                echo "- Push job failed before status artifacts were uploaded — see the DockerPush/DockerHub job logs."
              elif [[ "$DH_JOB" == "skipped" ]]; then
                echo "- Push job was skipped."
              else
                echo "- No per-component status artifacts found (unexpected)."
              fi
            fi
            if [[ "$DH_JOB" == "success" ]] && find dockerhub-meta -type f -name 'dockerhub-*.digest' 2>/dev/null | grep -q .; then
              echo ""
              echo "**Pull from DockerHub**"
              echo '```bash'
              echo "$COMPONENTS_JSON" | jq -r --arg ns "$DH_NS" --arg base "$IMG_BASE" --arg ver "$VER" \
                '.[] | "docker pull \($ns)/\($base)-\(.):\($ver)"'
              echo '```'
            fi
            echo ""

            echo "### GHCR"
            echo ""
            echo "- **Job result:** \`${GHCR_JOB}\`"
            if [[ "$GHCR_JOB" == "success" ]]; then
              echo "- Push succeeded for matrix components."
              echo ""
              echo "**Pull from GHCR**"
              echo '```bash'
              echo "$COMPONENTS_JSON" | jq -r --arg ns "$GHCR_NS" --arg base "$IMG_BASE" --arg ver "$VER" \
                '.[] | "docker pull ghcr.io/\($ns)/\($base)-\(.):\($ver)"'
              echo '```'
            elif [[ "$GHCR_JOB" == "failure" ]]; then
              echo "- Push failed — see the DockerPush/GHCR job logs. Images for this tag may be missing on GHCR."
            else
              echo "- Push job result \`${GHCR_JOB}\` — no GHCR pull instructions."
            fi
            echo ""

            echo "## Build from Source"
            echo ""
            echo '```bash'
            echo "git clone https://github.com/${{ github.repository }}.git"
            echo "cd ${REPO_BASENAME}"
            echo "git checkout ${TAG}"
            echo "source scripts/load-versions-env.sh"
            echo "docker buildx bake ${COMPONENT} --load \\"
            echo "  --set ${COMPONENT}.tags=${COMPONENT}:${VER} \\"
            echo "  --set \"*.args.APP_VERSION=${PEP440}\" \\"
            echo "  --set \"*.args.PYTHON_VERSION=\$PYTHON_VERSION\" \\"
            echo "  --set \"*.args.ALPINE_VERSION=\$ALPINE_VERSION\" \\"
            echo "  --set \"*.args.ALPINE_MINOR=\$ALPINE_MINOR\" \\"
            echo "  --set \"*.args.PIP_VERSION=\$PIP_VERSION\" \\"
            echo "  --set \"*.args.UV_VERSION=\$UV_VERSION\" \\"
            echo "  --set \"*.args.PYINSTALLER_VERSION=\$PYINSTALLER_VERSION\""
            echo '```'
            echo ""
            echo "Requires repo-root \`docker-bake.hcl\`, synced \`docker/Dockerfile.product-app.base\`,"
            echo "and product-local \`docker/Dockerfile.${COMPONENT}\` (Bake base + last stage; see Devinfra docs/ci.md)."
            echo ""

            echo "## Image licenses (Trivy)"
            echo ""
            echo "Informational only — license findings do **not** fail release or PR check. Vulnerability gates remain in"
            echo "\`reusable-check\` Security Check. See Devinfra \`docs/ci.md\`."
            echo ""
            any_lic=false
            while IFS= read -r comp; do
              md=$(find license-md -type f -name "license-${comp}.md" 2>/dev/null | head -1)
              if [[ -n "$md" && -f "$md" ]]; then
                any_lic=true
                cat "$md"
                echo ""
              fi
            done < <(echo "$COMPONENTS_JSON" | jq -r '.[]')
            if [[ "$any_lic" != "true" ]]; then
              echo "_No license Markdown artifacts (License Report job may have failed or been skipped — see workflow logs)._"
              echo ""
            fi
          } > release-body.md

      - name: Create GitHub Release (Draft)
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.create-release-tag.outputs.timestamp }}-${{ inputs.tag_prefix }}${{ inputs.version }}
          name: ${{ inputs.tag_prefix }}${{ inputs.version }}
          body_path: release-body.md
          draft: true
          prerelease: ${{ inputs.release_type == 'feature' }}
          generate_release_notes: true

      - name: Upload SBOM assets when present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(sboms/*)
          if (( ${#files[@]} == 0 )); then
            echo "No SBOM files to attach; release created without artifacts."
            exit 0
          fi
          TAG="${{ needs.create-release-tag.outputs.timestamp }}-${{ inputs.tag_prefix }}${{ inputs.version }}"
          gh release upload "$TAG" "${files[@]}" --clobber
          echo "Attached ${#files[@]} SBOM file(s) to $TAG"

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.create-release-tag.outputs.timestamp }}-${{ inputs.tag_prefix }}${{ inputs.version }}"
          echo "Finalizing release for tag: $TAG"
          sleep 5

          if RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases/tags/${TAG}" --jq '.id' 2>/dev/null); then
            echo "Found release ID via tag: $RELEASE_ID"
          else
            RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases" --jq ".[] | select(.tag_name == \"${TAG}\") | .id")
            if [[ -z "$RELEASE_ID" ]]; then
              echo "Release not found for tag $TAG" >&2
              exit 1
            fi
          fi

          gh api "repos/${{ github.repository }}/releases/$RELEASE_ID" \
            --method PATCH \
            --field draft=false
          echo "Release finalized successfully"
