# Canonical reusable Docker release for m4.2 product repos (issue #12).
# Call from the product repo:
#   uses: fairagro/m4.2_middleware_devinfra/.github/workflows/reusable-release.yml@<ref>
#
# Consumes build artifacts from reusable-build.yml (same workflow run).
# Does not publish to PyPI — keep PyPI jobs in the product repo (API-local).
name: Reusable Release

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      version:
        description: "Version calculated in Build phase"
        required: true
        type: string
      pep440_version:
        description: "PEP 440 version (accepted for caller compatibility; unused — no PyPI in this workflow)"
        required: false
        type: string
        default: ""
      components:
        description: "JSON array of components to release"
        required: false
        type: string
        default: '["api"]'
      image_base_name:
        description: "Image name prefix matching build tags (local/<prefix>-<component>:<version>)"
        required: false
        type: string
        default: "fairagro-advanced-middleware"
      dockerhub_namespace:
        description: "Docker Hub namespace / organization"
        required: false
        type: string
        default: "zalf"
      release_type:
        description: "Type of release (feature or final)"
        required: true
        type: string
      create_github_release:
        description: "Whether to create a GitHub release"
        required: false
        type: boolean
        default: true
      tag_prefix:
        description: "Prefix for the git release tag (e.g. docker-v)"
        required: false
        type: string
        default: "docker-v"
      skip:
        description: "Exit successfully without releasing"
        required: false
        type: boolean
        default: false
    secrets:
      DOCKERHUB_USER:
        required: true
      DOCKERHUB_TOKEN:
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  push-dockerhub:
    name: DockerPush/DockerHub
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        component: ${{ fromJson(inputs.components) }}
    outputs:
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Skipping release
        if: ${{ inputs.skip }}
        run: echo "Skip requested. Exiting with success."

      - name: Download Docker image artifact
        if: ${{ !inputs.skip }}
        uses: actions/download-artifact@v8
        with:
          name: docker-image-${{ matrix.component }}-${{ inputs.version }}

      - name: Load Docker image
        if: ${{ !inputs.skip }}
        run: |
          docker load < "docker-image-${{ matrix.component }}.tar.gz"
          echo "LOCAL_TAG=local/${{ inputs.image_base_name }}-${{ matrix.component }}:${{ inputs.version }}" >> "$GITHUB_ENV"

      - name: Login to DockerHub
        if: ${{ !inputs.skip }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and Push to DockerHub
        if: ${{ !inputs.skip }}
        id: push
        run: |
          DH_TAG="${{ inputs.dockerhub_namespace }}/${{ inputs.image_base_name }}-${{ matrix.component }}:${{ inputs.version }}"
          docker tag "${{ env.LOCAL_TAG }}" "$DH_TAG"
          docker push "$DH_TAG"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$DH_TAG" | cut -d'@' -f2)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Pushed to DockerHub: $DH_TAG"

  push-ghcr:
    name: DockerPush/GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: ${{ fromJson(inputs.components) }}

    steps:
      - name: Skipping release
        if: ${{ inputs.skip }}
        run: echo "Skip requested. Exiting with success."

      - name: Download Docker image artifact
        if: ${{ !inputs.skip }}
        uses: actions/download-artifact@v8
        with:
          name: docker-image-${{ matrix.component }}-${{ inputs.version }}

      - name: Load Docker image
        if: ${{ !inputs.skip }}
        run: |
          docker load < "docker-image-${{ matrix.component }}.tar.gz"
          echo "LOCAL_TAG=local/${{ inputs.image_base_name }}-${{ matrix.component }}:${{ inputs.version }}" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        if: ${{ !inputs.skip }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and Push to GHCR
        if: ${{ !inputs.skip }}
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          GHCR_TAG="ghcr.io/$REPO_LOWER/${{ matrix.component }}:${{ inputs.version }}"
          docker tag "${{ env.LOCAL_TAG }}" "$GHCR_TAG"
          docker push "$GHCR_TAG"
          echo "Pushed to GHCR: $GHCR_TAG"

  create-release-tag:
    name: CreateReleaseTag/Release
    if: ${{ !inputs.skip }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      timestamp: ${{ steps.timestamp.outputs.value }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate timestamp
        id: timestamp
        run: echo "value=$(date +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Create version tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: ${{ steps.timestamp.outputs.value }}-${{ inputs.tag_prefix }}${{ inputs.version }}
          tag_prefix: ""

  github-release:
    name: GitHubRelease/Release
    if: ${{ always() && !inputs.skip && inputs.create_github_release == true && needs.create-release-tag.result == 'success' }}
    needs: [push-dockerhub, push-ghcr, create-release-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download SBOM artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: sbom-*
          merge-multiple: true
          path: sboms

      - name: Generate release body
        run: |
          COMPONENT=$(echo '${{ inputs.components }}' | jq -r '.[0]')
          DH_IMAGE="${{ inputs.dockerhub_namespace }}/${{ inputs.image_base_name }}-${COMPONENT}:${{ inputs.version }}"
          DH_URL="https://hub.docker.com/r/${{ inputs.dockerhub_namespace }}/${{ inputs.image_base_name }}-${COMPONENT}"
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          GHCR_IMAGE="ghcr.io/${REPO_LOWER}/${COMPONENT}:${{ inputs.version }}"
          GHCR_URL="https://ghcr.io/${REPO_LOWER}/${COMPONENT}"
          TAG="${{ needs.create-release-tag.outputs.timestamp }}-${{ inputs.tag_prefix }}${{ inputs.version }}"
          REPO_BASENAME=$(basename "${{ github.repository }}")
          DOCKER_SUCCESS=$([[ "${{ needs.push-dockerhub.result }}" == "success" || "${{ needs.push-ghcr.result }}" == "success" ]] && echo "true" || echo "false")

          {
            echo "## Docker Image"
            echo ""
            if [[ "$DOCKER_SUCCESS" == "true" ]]; then
              if [[ "${{ needs.push-dockerhub.result }}" == "success" ]]; then
                echo "| Platform | Image Digest |"
                echo "| --- | --- |"
                echo "| linux/amd64 | \`${{ needs.push-dockerhub.outputs.digest }}\` |"
                echo ""
                echo "**[Pull from DockerHub](${DH_URL})**"
                echo '```bash'
                echo "docker pull ${DH_IMAGE}"
                echo '```'
                echo ""
              fi
              if [[ "${{ needs.push-ghcr.result }}" == "success" ]]; then
                echo "**[Pull from GHCR](${GHCR_URL})**"
                echo '```bash'
                echo "docker pull ${GHCR_IMAGE}"
                echo '```'
                echo ""
              fi
              echo "## Build from Source"
              echo ""
              echo '```bash'
              echo "git clone https://github.com/${{ github.repository }}.git"
              echo "cd ${REPO_BASENAME}"
              echo "git checkout ${TAG}"
              echo "source scripts/load-versions-env.sh"
              echo "docker build -f docker/Dockerfile.${COMPONENT} \\"
              echo "  --build-arg PYTHON_VERSION=\$PYTHON_VERSION \\"
              echo "  --build-arg ALPINE_VERSION=\$ALPINE_VERSION \\"
              echo "  --build-arg ALPINE_MINOR=\$ALPINE_MINOR \\"
              echo "  --build-arg PIP_VERSION=\$PIP_VERSION \\"
              echo "  --build-arg UV_VERSION=\$UV_VERSION \\"
              echo "  -t ${COMPONENT}:${{ inputs.version }} ."
              echo '```'
            else
              echo "_No Docker registries were successfully updated for this release._"
            fi
          } > release-body.md

      - name: Create GitHub Release (Draft)
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.create-release-tag.outputs.timestamp }}-${{ inputs.tag_prefix }}${{ inputs.version }}
          name: ${{ inputs.tag_prefix }}${{ inputs.version }}
          body_path: release-body.md
          draft: true
          prerelease: ${{ inputs.release_type == 'feature' }}
          generate_release_notes: true
          files: |
            sboms/*

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.create-release-tag.outputs.timestamp }}-${{ inputs.tag_prefix }}${{ inputs.version }}"
          echo "Finalizing release for tag: $TAG"
          sleep 5

          if RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases/tags/${TAG}" --jq '.id' 2>/dev/null); then
            echo "Found release ID via tag: $RELEASE_ID"
          else
            RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases" --jq ".[] | select(.tag_name == \"${TAG}\") | .id")
            if [[ -z "$RELEASE_ID" ]]; then
              echo "Release not found for tag $TAG" >&2
              exit 1
            fi
          fi

          gh api "repos/${{ github.repository }}/releases/$RELEASE_ID" \
            --method PATCH \
            --field draft=false
          echo "Release finalized successfully"
