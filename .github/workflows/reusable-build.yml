# Canonical reusable Docker build for m4.2 product repos (issue #12 / #36).
# Call from the product repo:
#   uses: fairagro/m4.2_middleware_devinfra/.github/workflows/reusable-build.yml@<ref>
#
# Artifact contract (consumed by reusable-check.yml):
#   - docker-image-<component>-<version>  → contains docker-image-<component>.tar.gz
#   - sbom-<component>-<version>          → contains sbom-<component>.spdx.json
# Local image tag inside the archive:
#   local/<image_base_name>-<component>:<version>
#
# Build layout (Bake-only, issue #36 — no monolith fallback):
#   - docker/Dockerfile.product-app.base   (synced shared base → export-binaries)
#   - docker/Dockerfile.<component>        (product-local last stage)
#   - docker-bake.hcl                      (repo root; target name = component)
name: Reusable Build

concurrency:
  group: ${{ github.repository }}-reusable-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      version_bump:
        description: "Version bump type: major, minor, or patch"
        required: false
        type: string
        default: "patch"
      components:
        description: "JSON array of components to build (required; no product default)"
        required: true
        type: string
      image_base_name:
        description: "Image name prefix for local/<prefix>-<component>:<version> tags"
        required: false
        type: string
        default: "fairagro-advanced-middleware"
      skip:
        description: "Exit successfully without building (PRs with no code changes)"
        required: false
        type: boolean
        default: false
    outputs:
      version:
        description: "Calculated Docker version"
        value: ${{ jobs.version.outputs.version }}
      pep440_version:
        description: "PEP 440 version for optional local Python packaging"
        value: ${{ jobs.version.outputs.pep440_version }}
      components:
        description: "JSON array of components that were built"
        value: ${{ inputs.components }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  version:
    name: Determine Version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.calc-version.outputs.version }}
      pep440_version: ${{ steps.calc-version.outputs.pep440_version }}

    steps:
      - uses: actions/checkout@v7
        if: ${{ !inputs.skip }}
        with:
          fetch-depth: 0

      - name: Calculate next version
        id: calc-version
        run: |
          if [[ "${{ inputs.skip }}" == "true" ]]; then
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "pep440_version=" >> "$GITHUB_OUTPUT"
            echo "No code files changed. Exiting with success."
            exit 0
          fi

          # grep exits 1 on no match; with Actions pipefail that aborts before 0.0.0 fallback
          LATEST_TAG=$(git tag --list '*-docker-v*' \
            | grep -E '^[0-9]+-docker-v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed 's/^[0-9]*-docker-v//' \
            | sort -V \
            | tail -1 || true)
          if [ -z "$LATEST_TAG" ]; then LATEST_TAG="0.0.0"; fi

          MAJOR=$(echo "$LATEST_TAG" | cut -d. -f1)
          MINOR=$(echo "$LATEST_TAG" | cut -d. -f2)
          PATCH=$(echo "$LATEST_TAG" | cut -d. -f3)

          case "${{ inputs.version_bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            *)     PATCH=$((PATCH + 1)) ;;
          esac

          BASE_VERSION="${MAJOR}.${MINOR}.${PATCH}"

          if [[ "$GITHUB_REF_NAME" == feature/* ]]; then
            BRANCH_LABEL=$(echo "$GITHUB_REF_NAME" | sed 's|feature/||' | tr '/_ ' '---' | cut -c1-30)
            NEW_VERSION="${BASE_VERSION}-rc.${BRANCH_LABEL}.${{ github.run_number }}"
            PEP440_VERSION="${BASE_VERSION}.dev${{ github.run_number }}"
          else
            NEW_VERSION="${BASE_VERSION}"
            PEP440_VERSION="${BASE_VERSION}"
          fi

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "pep440_version=$PEP440_VERSION" >> "$GITHUB_OUTPUT"

      - name: Report versions to summary
        if: ${{ !inputs.skip }}
        run: |
          echo "## Docker Build Versions" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version Type | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Docker Tag** | \`${{ steps.calc-version.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Python Build** | \`${{ steps.calc-version.outputs.pep440_version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"

  docker-build:
    name: Docker Build
    needs: version
    uses: $/.github/workflows/reusable-docker-bake.yml
    with:
      version: ${{ needs.version.outputs.version }}
      app_version: ${{ needs.version.outputs.pep440_version }}
      components: ${{ inputs.components }}
      image_base_name: ${{ inputs.image_base_name }}
      artifact_name_prefix: docker-image
      skip: ${{ inputs.skip }}

  generate-sbom:
    name: Generate SBOM
    needs: [version, docker-build]
    strategy:
      matrix:
        component: ${{ fromJson(inputs.components) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: No code changes — skipping SBOM
        if: ${{ inputs.skip }}
        run: echo "No code files changed. Exiting with success."

      - name: Download Docker image artifact
        if: ${{ !inputs.skip }}
        uses: actions/download-artifact@v8
        with:
          name: docker-image-${{ matrix.component }}-${{ needs.version.outputs.version }}

      - name: Load Docker image
        if: ${{ !inputs.skip }}
        run: docker load < "docker-image-${{ matrix.component }}.tar.gz"

      - name: Generate SBOM
        if: ${{ !inputs.skip }}
        uses: anchore/sbom-action@v0
        with:
          image: local/${{ inputs.image_base_name }}-${{ matrix.component }}:${{ needs.version.outputs.version }}
          # Workspace-root path: upload-artifact keeps directories; check expects sbom-<component>.spdx.json
          output-file: sbom-${{ matrix.component }}.spdx.json
          format: spdx-json

      - name: Upload SBOM artifact
        if: ${{ !inputs.skip }}
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ matrix.component }}-${{ needs.version.outputs.version }}
          path: sbom-${{ matrix.component }}.spdx.json
          retention-days: 1
