# Shared Mypy config for m4.2 product repos (sync into product checkout root).
# Seeded from m4.2_advanced_middleware_api strictness settings.
#
# Product-local overlay: set mypy_path (and any extra excludes) in a local mypy
# override or keep a thin [tool.mypy] stub in product pyproject.toml that only
# sets mypy_path — do not fork the shared strictness flags.
# Example (API-shaped):
#   mypy_path = middleware/api/src:middleware/api_client/src:middleware/shared/src:...

[mypy]
python_version = 3.12
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
explicit_package_bases = True
namespace_packages = True
exclude = (?x)(
    ^\.venv/
    | ^venv/
    | ^\.git/
    | ^__pycache__/
    | ^build/
    | ^dist/
    | ^\.pytest_cache/
    | ^\.mypy_cache/
    | ^\.ruff_cache/
    | .*/tests/conftest\.py$
    | .*/tests/.+/conftest\.py$
  )
